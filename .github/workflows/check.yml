name: Check that free Macs start here (1 minute)
# Job row 893: GitHub's billing lock on the owner's account may also stop public repos. This tiny run tells.
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/check.yml]
permissions: {contents: read}
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Linux runner started - public-repo Actions work on this account."
  mac:
    runs-on: macos-15
    timeout-minutes: 3
    steps:
      - run: sw_vers && echo "Mac runner started - the free iPhone route works here."
